# nginx.conf
#
# Cấu hình nginx dùng trong Docker image frontend (Dockerfile). Hai việc
# chính:
# 1. SPA fallback: Vite/React Router dùng History API (URL kiểu /events/123
#    không có file tĩnh thật tương ứng) - nếu web server trả 404 khi load
#    thẳng một đường dẫn sâu thì vì "try_files" trả về /index.html thay vì
#    tìm file ảo. Đây là lỗi cấu hình nginx trong React rất hay gặp khi
#    deploy (dù render trực tiếp / thành /admin đều ra trang chuẩn).
# 2. gzip: nén JS/CSS/JSON trước khi trả về - app Vite đã được minify +
#    tree-shaking, thêm gzip giúp giảm tiếp băng thông (đặc biệt tốt với
#    Free tier Render/nginx khi user ở xa).

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback - mọi đường dẫn không khớp file thật đều serve index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Nén trước khi gửi (chỉ nén những loại đáng nén)
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;
}
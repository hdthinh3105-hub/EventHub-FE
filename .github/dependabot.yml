version: 2
updates:
  # npm dependencies (React 19 + Vite + TypeScript + Vitest)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: "Asia/Ho_Chi_Minh"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      react:
        patterns: ["react", "react-dom"]
      vite-tooling:
        patterns: ["vite", "@vitejs/plugin-react", "vitest", "jsdom"]
      typescript:
        patterns: ["typescript"]
      types-packages:
        patterns: ["@types/*"]
      testing-library:
        patterns: ["@testing-library/*"]

  # Docker base images trong Dockerfile
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5